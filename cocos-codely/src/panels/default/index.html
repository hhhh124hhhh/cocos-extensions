<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Cocos Creator 编辑器配色，让 dsh web 的 iframe 像原生面板的一部分 */
      :root {
        --cocos-bg: #1e1e1e;      /* Cocos 编辑器深灰底，避免 iframe 加载前白闪 */
        --cocos-accent: #2d8cf0;  /* Cocos Creator 品牌蓝 */
        --cocos-fg: #cfcfcf;
        --cocos-fg-dim: #9a9a9a;
      }
      html, body {
        margin: 0; height: 100%;
        font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", "Helvetica Neue", Arial, sans-serif;
        font-size: 13px; background: var(--cocos-bg);
      }
      #panel { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
      /* 顶部 2px Cocos 蓝强调线：让面板读起来「属于 Cocos 编辑器」 */
      #panel::before {
        content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
        background: var(--cocos-accent); z-index: 20;
      }
      #dsh-frame { flex: 1; width: 100%; border: 0; display: block; background: var(--cocos-bg); }
      /* 启动遮罩：dsh 未就绪时显示「正在启动 dsh…」，iframe 加载成功后由 index.js 隐藏 */
      #boot-mask {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 8px; background: var(--cocos-bg); color: var(--cocos-fg); z-index: 10;
      }
      #boot-mask .spinner {
        width: 28px; height: 28px; border: 3px solid #3a3a3a; border-top-color: var(--cocos-accent);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      #boot-mask .hint { font-size: 12px; color: var(--cocos-fg-dim); max-width: 80%; text-align: center; line-height: 1.5; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="panel">
      <iframe id="dsh-frame" src="http://127.0.0.1:3080" title="Codely (dsh web)"></iframe>
      <div id="boot-mask">
        <div class="spinner"></div>
      <div>正在连接 dsh…</div>
      <div class="hint">若长时间未加载，请确认 dsh web 已在 http://127.0.0.1:3080 启动（守护进程或手动启动 dsh 后本面板会自动加载）。</div>
      </div>
    </div>
  </body>
</html>
