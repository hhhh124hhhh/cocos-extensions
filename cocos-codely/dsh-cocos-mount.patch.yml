# dsh 补丁: 将 Cocos 编辑器内的 cocos-mcp-bridge HTTP MCP server 挂进 dsh
- insert:
    - id: mcp-cocos
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: cocos
        transport: streamable-http
        url: http://127.0.0.1:8765/
        toolCallTimeoutMs: 120000
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
